- body: "異なる 6 個の球から 3 個を選んで一列に並べる方法は何通りあるか"
  category: "基礎理論"
  status: published
  explanation: |
    並び順を区別する順列なので nPr = n! / (n − r)! を使います。
    6P3 = 6! / 3! = (6 × 5 × 4 × 3 × 2 × 1) / (3 × 2 × 1) = 6 × 5 × 4 = 120 通り

    ア「20」は組合せ 6C3 = 20 通り（並び順を区別しない場合）、ウ「216」は 6³ で重複を許す順列の値、エ「720」は 6P6 = 6! で全部を並べる場合の値です。
  options:
    - { body: "20", correct: false }
    - { body: "120", correct: true }
    - { body: "216", correct: false }
    - { body: "720", correct: false }

- body: "ある商品のレアアイテムの排出率は 2% である。5 回引いたときに、少なくとも 1 回はレアアイテムが出る確率はおよそ何 % か"
  category: "基礎理論"
  status: published
  explanation: |
    余事象「5 回とも出ない確率」を計算してから 1 から引きます。
    1 回で出ない確率は 1 − 0.02 = 0.98
    5 回連続で出ない確率は 0.98^5 ≈ 0.904
    少なくとも 1 回出る確率は 1 − 0.904 = 0.096 ≈ 9.6%

    イ「10%」は最も近い値で正解。ア「2%」は 1 回の排出率そのもの、ウ「90%」は余事象「1 回も出ない確率」、エ「98%」は 1 回で出ない確率を答えとする誤りです。
  options:
    - { body: "2%", correct: false }
    - { body: "10%", correct: true }
    - { body: "90%", correct: false }
    - { body: "98%", correct: false }

- body: "サイコロを 1 個振り、出た目に応じて次の金額を受け取るゲームがある。出た目が偶数なら 600円、奇数なら 0円を受け取る。1 回振ったときに受け取る金額の期待値はいくらか"
  category: "基礎理論"
  status: published
  explanation: |
    期待値 E(X) = Σ(値 × 確率) を使います。
    偶数 (2, 4, 6) が出る確率は 3/6 = 1/2、奇数 (1, 3, 5) が出る確率は 1/2 です。
    E = 600 × (1/2) + 0 × (1/2) = 300 円

    ア「150 円」は偶数を 1/4 の確率と誤って計算した値、ウ「450 円」は (600 + 300) / 2 のような誤計算、エ「600 円」は偶数のときの金額そのものを期待値と混同した誤りです。
  options:
    - { body: "150 円", correct: false }
    - { body: "300 円", correct: true }
    - { body: "450 円", correct: false }
    - { body: "600 円", correct: false }
