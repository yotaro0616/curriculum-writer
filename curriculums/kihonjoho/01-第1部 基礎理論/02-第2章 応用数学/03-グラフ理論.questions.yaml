- body: "次の特徴を持つグラフを表現するのに最も適したデータ構造はどれか。頂点数は 100 万、各頂点から伸びる辺の平均本数は 50 本程度（疎なグラフ）"
  category: "基礎理論"
  status: published
  explanation: |
    疎なグラフでは、隣接行列を使うと 100 万 × 100 万 = 10^12 個のセルが必要になり、メモリ容量を大幅に超えます。一方、隣接リストなら頂点数 + 辺の総本数 = 100 万 + 5,000 万 ≈ 5,100 万要素で済み、現実的に扱えます。

    ウ「隣接リスト」が正解。ア「隣接行列」は疎なグラフではメモリ効率が悪く不適。イ「ハッシュテーブル単独」は頂点間のつながりを表現する構造ではない。エ「スタック」は LIFO のデータ構造でグラフ全体の表現には適さない。
  options:
    - { body: "隣接行列", correct: false }
    - { body: "ハッシュテーブル単独", correct: false }
    - { body: "隣接リスト", correct: true }
    - { body: "スタック", correct: false }

- body: "ダイクストラ法の説明として、正しいものはどれか"
  category: "基礎理論"
  status: published
  explanation: |
    ダイクストラ法は、負の重みを含まない重み付きグラフにおいて、始点から各頂点への最短経路を求めるアルゴリズムです。負の重みがあると、距離が小さい頂点を確定したあとで、より短い経路が後から見つかってしまう可能性があるため正しく動作しません。

    ア「負の重みを持つグラフ...」が正解。イ「すべての頂点間の最短経路を直接求める」は全点対最短経路問題で、ワーシャル・フロイド法などが該当します。ウ「重みを考慮しない」は幅優先探索 (BFS) の説明、エ「木構造専用」はダイクストラ法はグラフ一般に適用できるため誤りです。
  options:
    - { body: "負の重みを持つグラフには適用できない、始点から各頂点への最短経路を求めるアルゴリズム", correct: true }
    - { body: "グラフ内のすべての頂点間の最短経路を一度の計算で直接求めるアルゴリズム", correct: false }
    - { body: "辺の重みを考慮せず、辺の本数だけが最少になる経路を求めるアルゴリズム", correct: false }
    - { body: "木構造でのみ動作し、葉までの最短距離を求めるアルゴリズム", correct: false }

- body: "次の隣接行列で表される無向グラフがある。頂点 A の次数（接続する辺の本数）はいくつか。行列の値が 1 のとき辺があることを意味する。     A B C D   A 0 1 1 0   B 1 0 0 1   C 1 0 0 1   D 0 1 1 0"
  category: "基礎理論"
  status: published
  explanation: |
    頂点 A の行を見ると、A-B が 1、A-C が 1、A-D が 0 です。つまり A は B と C の 2 つの頂点と辺を持ちます。
    したがって A の次数は 2 です。

    ウ「2」が正解。ア「0」は孤立頂点の場合、イ「1」は 1 本だけ辺がある場合、エ「3」は A が B, C, D すべてと繋がる場合の値で、いずれもこの行列とは一致しません。
  options:
    - { body: "0", correct: false }
    - { body: "1", correct: false }
    - { body: "2", correct: true }
    - { body: "3", correct: false }
