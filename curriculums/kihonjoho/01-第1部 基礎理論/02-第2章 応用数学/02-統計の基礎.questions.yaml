- body: "5 つのデータ 2, 4, 4, 6, 9 の標準偏差はおよそいくらか"
  category: "基礎理論"
  status: published
  explanation: |
    まず平均を求めます。
    平均 = (2 + 4 + 4 + 6 + 9) / 5 = 25 / 5 = 5
    偏差 = -3, -1, -1, 1, 4
    偏差² = 9, 1, 1, 1, 16
    分散 = (9 + 1 + 1 + 1 + 16) / 5 = 28 / 5 = 5.6
    標準偏差 = √5.6 ≈ 2.37

    ウ「約 2.37」が正解。ア「約 1.41」は √2、イ「約 1.67」は √(分散の半分) のような誤計算、エ「約 5.60」は分散そのものを答えとした誤りです。
  options:
    - { body: "約 1.41", correct: false }
    - { body: "約 1.67", correct: false }
    - { body: "約 2.37", correct: true }
    - { body: "約 5.60", correct: false }

- body: "ある試験の点数が平均 60 点、標準偏差 10 点の正規分布に従うとき、点数が 40 点以上 80 点以下の範囲に含まれる受験者の割合はおよそ何 % か"
  category: "基礎理論"
  status: published
  explanation: |
    40 点から 80 点は、平均 60 点から ±2 標準偏差（±20 点）の範囲です。
    正規分布の 68-95-99.7 ルールにより、平均 ±2σ の範囲には全体の約 95% が含まれます。

    エ「約 95%」が正解。ア「約 50%」は平均より下の割合、イ「約 68%」は平均 ±1σ の範囲、ウ「約 99.7%」は平均 ±3σ の範囲です。
  options:
    - { body: "約 50%", correct: false }
    - { body: "約 68%", correct: false }
    - { body: "約 99.7%", correct: false }
    - { body: "約 95%", correct: true }

- body: "2 つの変数 X と Y の相関係数の値とその解釈の組合せとして、最も適切なものはどれか"
  category: "基礎理論"
  status: published
  explanation: |
    相関係数 r は -1 から +1 の範囲を取り、絶対値が 1 に近いほど強い相関を、0 に近いほど無相関を意味します。負の値は「一方が増えると他方が減る」関係を表します。

    イ「r = -0.85 → X が増えると Y は減る傾向が強い」は強い負の相関の正しい解釈です。ア「r = 0.05 → 強い正の相関」は 0 に近いので無相関と解釈すべき誤り、ウ「r = 1.5 → 完全な正の相関」は相関係数の範囲を超えた誤り、エ「r = -1.0 → X と Y は無関係」は -1 が完全な負の相関を意味するので誤りです。
  options:
    - { body: "r = 0.05 → 強い正の相関がある", correct: false }
    - { body: "r = -0.85 → X が増えると Y は減る傾向が強い", correct: true }
    - { body: "r = 1.5 → 完全な正の相関がある", correct: false }
    - { body: "r = -1.0 → X と Y は無関係である", correct: false }
