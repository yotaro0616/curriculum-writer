- body: "次の 2 つの行列 A と B の積 A × B の (1, 1) 要素（1 行 1 列目）の値はいくつか。   A = | 2  3 |   B = | 1  4 |       | 1  0 |       | 5  2 |"
  category: "基礎理論"
  status: published
  explanation: |
    A × B の (1, 1) 要素は、A の 1 行目 (2, 3) と B の 1 列目 (1, 5) の内積で計算します。
    2 × 1 + 3 × 5 = 2 + 15 = 17

    イ「17」が正解。ア「7」は 2 × 1 + 1 × 5 のような誤計算、ウ「14」は 2 × 4 + 3 × 2 で (1, 2) 要素を求めた誤り、エ「5」は対応関係を取り違えた誤計算です。
  options:
    - { body: "7", correct: false }
    - { body: "17", correct: true }
    - { body: "14", correct: false }
    - { body: "5", correct: false }

- body: "浮動小数点数の演算における「桁落ち」の説明として、適切なものはどれか"
  category: "基礎理論"
  status: published
  explanation: |
    桁落ちは、値がほぼ等しい 2 つの数の引き算において、結果の有効桁数が大きく減ってしまう誤差です。例えば 1.234567 − 1.234566 = 0.000001 のように、有効桁 7 桁が 1 桁に減ります。

    エが正解。ア「絶対値が大きく異なる数を加算...」は情報落ちの説明、イ「演算結果が表現可能な範囲を超える」は桁あふれ（オーバフロー）の説明、ウ「有限の仮数部で 10 進小数...」は丸め誤差の説明です。
  options:
    - { body: "絶対値が大きく異なる数を加算した結果、小さい方の値が表現上失われる現象", correct: false }
    - { body: "演算結果が表現可能な範囲を超えてしまい、正しい値が得られなくなる現象", correct: false }
    - { body: "有限の仮数部で 10 進数の小数を表現するときに、最下位桁で発生する誤差", correct: false }
    - { body: "値がほぼ等しい 2 つの数の引き算で、結果の有効桁数が大きく減ってしまう現象", correct: true }

- body: "行列に関する記述として、誤っているものはどれか"
  category: "基礎理論"
  status: published
  explanation: |
    行列の積は一般に交換法則が成り立たず、A × B と B × A の結果は異なります。したがってウが「誤っているもの」として正解です。

    ア「単位行列は A × I = A」は正しい記述、イ「行列式が 0 の行列には逆行列が存在しない」も特異行列の定義として正しい記述、エ「加減算は同サイズの行列同士でのみ可能」も正しい記述です。
  options:
    - { body: "単位行列 I は対角成分が 1、それ以外が 0 の正方行列で、A × I = A が成立する", correct: false }
    - { body: "行列式が 0 の正方行列には逆行列が存在しない", correct: false }
    - { body: "行列の積は交換法則を満たし、A × B と B × A の結果は常に等しい", correct: true }
    - { body: "行列の加算と減算は、同じサイズの行列同士でのみ計算可能である", correct: false }
