- body: "4 種類の記号 A, B, C, D がそれぞれ確率 1/2, 1/4, 1/8, 1/8 で出現する情報源について、1 記号あたりの平均情報量（エントロピー）として正しいものはどれか"
  category: "基礎理論"
  status: published
  explanation: |
    エントロピー H = -Σ pᵢ × log₂(pᵢ) で計算します。
    H = -(1/2 × log₂(1/2) + 1/4 × log₂(1/4) + 1/8 × log₂(1/8) + 1/8 × log₂(1/8))
      = 1/2 × 1 + 1/4 × 2 + 1/8 × 3 + 1/8 × 3
      = 0.5 + 0.5 + 0.375 + 0.375
      = 1.75 bit

    ア「1.5 bit」は計算ミス、ウ「2.0 bit」は 4 種類を等確率と仮定したときの値、エ「3.0 bit」は最も稀少な記号の情報量です。
  options:
    - { body: "1.5 bit", correct: false }
    - { body: "1.75 bit", correct: true }
    - { body: "2.0 bit", correct: false }
    - { body: "3.0 bit", correct: false }

- body: "4 種類の文字 A, B, C, D に対してハフマン符号化を行ったとき、符号として適切でないものはどれか"
  category: "基礎理論"
  status: published
  explanation: |
    ハフマン符号は接頭辞条件（ある符号が別の符号の先頭部分にならない）を満たす必要があります。これを満たさないと一意に復号できません。

    エ「A:0, B:01, C:10, D:11」は A の符号「0」が B の符号「01」の先頭部分になっており接頭辞条件に違反します。
    ア・イ・ウはすべて接頭辞条件を満たし、ハフマン符号として有効です。
  options:
    - { body: "A:0, B:10, C:110, D:111", correct: false }
    - { body: "A:00, B:01, C:10, D:11", correct: false }
    - { body: "A:1, B:01, C:001, D:000", correct: false }
    - { body: "A:0, B:01, C:10, D:11", correct: true }

- body: "データ圧縮方式に関する記述として、適切なものはどれか"
  category: "基礎理論"
  status: published
  explanation: |
    ウ「JPEG は非可逆圧縮で、人間の視覚特性を利用して情報の一部を捨てる」が正解です。JPEG は高周波成分（細かい変化）を削ることで高い圧縮率を実現します。

    ア「ZIP は非可逆圧縮」は誤り。ZIP は可逆圧縮で、解凍すれば元のデータが完全に復元できます。
    イ「ハフマン符号化は等確率で出現する記号に対して圧縮効果が最大化する」は誤り。出現確率に偏りがあるほど圧縮効果が高まります。等確率では圧縮効果はほぼゼロです。
    エ「ランレングス符号化は連続しない記号列に効果的」は誤り。RLE は同じ値が連続する部分を圧縮する方式で、連続が少ないデータではむしろサイズが増えることもあります。
  options:
    - { body: "ZIP は非可逆圧縮であり、解凍時にわずかにデータが変化する", correct: false }
    - { body: "ハフマン符号化は等確率で出現する記号に対して圧縮効果が最大化する", correct: false }
    - { body: "JPEG は非可逆圧縮で、人間の視覚特性を利用して情報の一部を捨てる", correct: true }
    - { body: "ランレングス符号化は連続しない記号列に効果的である", correct: false }
