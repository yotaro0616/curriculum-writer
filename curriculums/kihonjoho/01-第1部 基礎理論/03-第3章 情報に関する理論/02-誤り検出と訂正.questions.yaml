- body: "偶数パリティを用いる場合、7 ビットのデータ 1011001 に付加すべきパリティビットの値はどれか"
  category: "基礎理論"
  status: published
  explanation: |
    偶数パリティは「データとパリティを合わせた 1 の総数が偶数」になるよう値を決めます。
    データ 1011001 の中の 1 の個数は 4 個（既に偶数）です。したがって、付加するパリティビットは 0 にすれば全体（1 が 4 個）が偶数のまま保たれます。

    ア「1」を付けると 1 の総数が 5 個で奇数になり偶数パリティの条件を満たしません。
    ウ「データに依存しない」、エ「常に最終ビットの反転」は偶数パリティの定義と異なります。
  options:
    - { body: "1", correct: false }
    - { body: "0", correct: true }
    - { body: "データ内容に依存せず常に 0", correct: false }
    - { body: "データの最終ビットを反転した値", correct: false }

- body: "誤り検出 / 訂正の方式に関する記述のうち、適切なものはどれか"
  category: "基礎理論"
  status: published
  explanation: |
    ウ「ハミング符号は 1 ビットの誤りを訂正でき、2 ビットの誤りを検出できる」が正解です。これは標準的なハミング符号の能力です。

    ア「パリティチェックは 2 ビットの誤りも検出できる」は誤り。2 ビットが同時に反転すると 1 の偶奇が元に戻るため検出できません。
    イ「CRC は誤りを検出するだけでなく、訂正もできる」は誤り。CRC は検出のみで訂正能力はありません。
    エ「ハミング符号はバースト誤りに最も強い」は誤り。バースト誤りに強いのは CRC で、ハミング符号は単発の 1 ビット誤りを訂正する用途に向いています。
  options:
    - { body: "パリティチェックは 2 ビットの誤りも検出できる", correct: false }
    - { body: "CRC は誤りを検出するだけでなく、訂正もできる", correct: false }
    - { body: "ハミング符号は 1 ビットの誤りを訂正でき、2 ビットの誤りを検出できる", correct: true }
    - { body: "ハミング符号はバースト誤り（連続する複数ビット誤り）に最も強い", correct: false }

- body: "Ethernet フレームの末尾に付加され、データ部の整合性を高い確率で検証するために使われる誤り検出方式はどれか"
  category: "基礎理論"
  status: published
  explanation: |
    エ「CRC」が正解です。Ethernet の FCS（Frame Check Sequence）には CRC-32 が使われ、バースト誤りに強く、典型的なフレーム長で 99.99% 以上の検出率を持ちます。

    ア「単純パリティ」は 1 ビット誤りしか検出できず、フレーム単位の誤り検出には不十分です。
    イ「ハミング符号」は主にメモリ ECC など訂正が必要な場面で使い、Ethernet のような再送可能な通信路では使われません。
    ウ「ランレングス符号」は誤り検出ではなくデータ圧縮の方式です。
  options:
    - { body: "単純パリティチェック", correct: false }
    - { body: "ハミング符号", correct: false }
    - { body: "ランレングス符号化", correct: false }
    - { body: "CRC（巡回冗長検査）", correct: true }
