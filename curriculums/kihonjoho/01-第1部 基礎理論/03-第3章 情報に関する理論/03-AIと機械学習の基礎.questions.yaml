- body: "機械学習における「教師なし学習」の例として最も適切なものはどれか"
  category: "基礎理論"
  status: published
  explanation: |
    ウ「顧客の購買履歴から、似た傾向の顧客をグループ化する」が正解です。これはクラスタリングと呼ばれ、正解ラベルなしでデータの構造を発見する典型的な教師なし学習です。

    ア「過去のスパム / 健全ラベル付きメールから判定モデルを学習する」は教師あり学習（分類）です。
    イ「過去の物件価格から将来の価格を予測する」は教師あり学習（回帰）です。
    エ「ゲームのスコアが最大になる行動方針を試行錯誤で学習する」は強化学習です。
  options:
    - { body: "過去のスパム / 健全ラベル付きメールから判定モデルを学習する", correct: false }
    - { body: "過去の物件価格データから新しい物件の価格を予測する", correct: false }
    - { body: "顧客の購買履歴から、似た傾向の顧客をグループ化する", correct: true }
    - { body: "ゲームのスコアが最大になる行動方針を試行錯誤で学習する", correct: false }

- body: "機械学習における過学習（overfitting）に関する記述として、適切なものはどれか"
  category: "基礎理論"
  status: published
  explanation: |
    ア「学習データに過剰に適合し、未知のデータに対する精度が下がる現象」が正解です。これが過学習の定義です。

    イ「学習回数が不足し、モデルが十分に最適化されない現象」は学習不足（underfitting）の説明で、過学習とは逆の現象です。
    ウ「学習データに含まれる誤りやノイズが取り除かれる」は前処理（データクリーニング）の説明で、過学習とは関係ありません。
    エ「複数のモデルを統合して精度を向上させる手法」はアンサンブル学習の説明で、過学習対策の一手段ですが過学習そのものではありません。
  options:
    - { body: "学習データに過剰に適合し、未知のデータに対する精度が下がる現象", correct: true }
    - { body: "学習回数が不足し、モデルが十分に最適化されない現象", correct: false }
    - { body: "学習データに含まれる誤りやノイズが自動的に取り除かれる現象", correct: false }
    - { body: "複数のモデルを統合して精度を向上させる手法のこと", correct: false }

- body: "大規模言語モデル（LLM）に関する記述として、適切なものはどれか"
  category: "基礎理論"
  status: published
  explanation: |
    エ「学習データの統計的パターンに基づき次のトークンを予測するため、事実と異なる内容を生成することがある」が正解です。これがハルシネーション（hallucination）と呼ばれる現象の本質です。

    ア「常に最新の情報を回答できる」は誤り。LLM は学習データの時点までの知識しか持たず、それ以降の情報は持ちません（RAG など外部検索と組み合わせない限り）。
    イ「内部の判断根拠を厳密に説明できる」は誤り。ディープラーニング全般に共通する課題として「ブラックボックス問題」があり、判断根拠の説明は難しいとされています。
    ウ「ハルシネーションは技術改良で完全に解消されている」は誤り。2026 年時点でも完全な解消はされておらず、生成内容の検証が必要です。
  options:
    - { body: "学習時点に関わらず常に最新の情報を回答できる", correct: false }
    - { body: "ディープラーニングのため、内部の判断根拠を厳密に説明できる", correct: false }
    - { body: "ハルシネーション（事実と異なる出力）は技術改良で完全に解消されている", correct: false }
    - { body: "学習データの統計的パターンに基づき次のトークンを予測するため、事実と異なる内容を生成することがある", correct: true }
