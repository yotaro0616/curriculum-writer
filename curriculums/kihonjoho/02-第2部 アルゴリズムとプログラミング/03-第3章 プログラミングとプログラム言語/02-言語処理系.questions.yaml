- body: "コンパイラの処理工程として最も適切な順序はどれか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    コンパイラはソースコードを「字句解析 → 構文解析 → 意味解析 → 最適化 → 目的コード生成」の順で処理します。トークンに分解（字句解析）してから、文法構造を組み立て（構文解析）、型や宣言の整合性を確認（意味解析）した後で最適化を施し、機械語などの目的コードに変換します。

    イは構文解析と字句解析の順序が逆、ウは意味解析が抜けている、エは目的コード生成と最適化の順序が逆で、いずれも標準的な工程と一致しません。
  options:
    - { body: "字句解析 → 構文解析 → 意味解析 → 最適化 → 目的コード生成", correct: true }
    - { body: "構文解析 → 字句解析 → 意味解析 → 最適化 → 目的コード生成", correct: false }
    - { body: "字句解析 → 構文解析 → 最適化 → 目的コード生成", correct: false }
    - { body: "字句解析 → 構文解析 → 意味解析 → 目的コード生成 → 最適化", correct: false }

- body: "JIT コンパイラに関する記述として最も適切なものはどれか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    JIT（Just-In-Time）コンパイラはプログラム実行中に、頻繁に呼ばれる箇所（ホットスポット）を動的に機械語へ変換して以後の実行を高速化する仕組みです。JavaScript の V8 エンジンや Java の HotSpot VM が代表例です。

    ア「事前にすべて機械語に変換」は通常の AOT コンパイラの説明。イ「1 行ずつ解釈する」は純粋なインタプリタの説明。エ「ソースコードを暗号化する」は処理系の役割ではなく、JIT とは無関係です。
  options:
    - { body: "実行前に全てのソースコードを機械語に変換し、変換結果を保存する", correct: false }
    - { body: "ソースコードを 1 行ずつ解釈しながら実行する", correct: false }
    - { body: "実行中に頻繁に実行される部分を動的に機械語に変換して高速化する", correct: true }
    - { body: "ソースコードを暗号化して機密性を高める", correct: false }

- body: "リンカ（リンケージエディタ）の役割として最も適切なものはどれか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    リンカは、コンパイラが生成した複数のオブジェクトファイルと外部ライブラリを結合し、外部参照を解決して 1 つの実行ファイルを作るツールです。

    ア「ソースコードを機械語に変換する」はコンパイラの役割。イ「実行ファイルをメモリに読み込む」はローダの役割。ウ「アセンブリ言語を機械語に変換」はアセンブラの役割で、いずれもリンカではありません。
  options:
    - { body: "ソースコードを字句解析・構文解析して機械語に変換する", correct: false }
    - { body: "実行ファイルをメモリに読み込んでプログラムの実行を開始する", correct: false }
    - { body: "アセンブリ言語を機械語に変換する", correct: false }
    - { body: "複数のオブジェクトファイルと外部ライブラリを結合し、実行可能ファイルを生成する", correct: true }
