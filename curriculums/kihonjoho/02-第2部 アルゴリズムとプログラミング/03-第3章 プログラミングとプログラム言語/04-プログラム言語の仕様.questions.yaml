- body: "値渡しと参照渡しに関する記述として最も適切なものはどれか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    参照渡しは変数の格納場所（メモリアドレス）を渡す方式で、関数内で引数を書き換えると呼び出し元の変数も変化します。C のポインタや PHP の `&$x` のように参照渡しを明示する仕組みが代表例です。

    ア「値渡しは関数内の変更が呼び出し元に反映される」は逆で、値渡しは反映されません。ウ「参照渡しは値を複製してから渡す」は値渡しの説明。エ「Java はすべて参照渡し」は誤りで、Java はすべて値渡し（オブジェクトの場合は参照を値として渡している）です。
  options:
    - { body: "値渡しでは関数内で引数を変更すると呼び出し元の変数も変更される", correct: false }
    - { body: "参照渡しでは関数内で引数を変更すると呼び出し元の変数も変更される", correct: true }
    - { body: "参照渡しでは引数の値を複製してから関数に渡す", correct: false }
    - { body: "Java はすべての引数を参照渡しで関数に渡す", correct: false }

- body: "プログラム言語の型付けに関する記述として最も適切なものはどれか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    静的型付け言語では、変数や引数の型がコンパイル時に確定し、コンパイラが型の整合性を検査します。これにより実行前に多くの型エラーを検出できる利点があります。代表例は Java、C、TypeScript などです。

    ア「動的型付け言語ではコンパイル時に型を検査する」は逆で、動的型付けは実行時に検査します。イ「強い型付け言語は暗黙の型変換を広く許容する」は逆で、強い型付けは暗黙変換を厳しく制限します。ウ「Python は静的型付け言語」は誤りで、Python は動的型付け言語です。
  options:
    - { body: "動的型付け言語では、変数の型をコンパイル時に検査する", correct: false }
    - { body: "強い型付け言語は、異なる型同士の暗黙の型変換を広く許容する", correct: false }
    - { body: "Python は静的型付け言語に分類される", correct: false }
    - { body: "静的型付け言語では、変数や引数の型がコンパイル時に確定する", correct: true }

- body: "JavaScript の var、let、const のスコープに関する記述として最も適切なものはどれか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    JavaScript では、`var` は関数全体をスコープとする関数スコープ、`let` と `const` は `{ }` のブロック内に限定されるブロックスコープを持ちます。`if` 文や `for` 文のブロック内で `let` / `const` を宣言した変数は、そのブロックの外からは参照できません。

    イ「var はブロックスコープ」は誤り。ウ「let と const はグローバルスコープ」は誤り。エ「var let const のすべてがブロックスコープ」は誤りで、`var` だけが関数スコープです。
  options:
    - { body: "var は関数スコープ、let と const はブロックスコープを持つ", correct: true }
    - { body: "var はブロックスコープ、let と const は関数スコープを持つ", correct: false }
    - { body: "let と const は常にグローバルスコープを持つ", correct: false }
    - { body: "var、let、const のすべてがブロックスコープを持つ", correct: false }
