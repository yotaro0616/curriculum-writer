- body: "次のうち、宣言型言語に分類されるものはどれか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    SQL は「何を求めるか（欲しいレコードの条件）」を宣言し、「どう求めるか（実行計画）」は DB エンジンに任せる宣言型言語の典型例です。

    ア「C 言語」は手続き型、ウ「Java」はオブジェクト指向、エ「Ruby」もオブジェクト指向に分類されます。SQL のように手順ではなく結果のかたちを書く言語が宣言型です。
  options:
    - { body: "C 言語", correct: false }
    - { body: "SQL", correct: true }
    - { body: "Java", correct: false }
    - { body: "Ruby", correct: false }

- body: "オブジェクト指向プログラミングの 3 つの基本概念に該当しないものはどれか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    オブジェクト指向プログラミングの 3 つの基本概念は「カプセル化」「継承」「ポリモーフィズム」です。「再帰」は関数が自分自身を呼び出す制御構造のことで、オブジェクト指向の概念ではありません。

    ア「カプセル化」はデータと操作を 1 つにまとめて隠蔽すること、イ「継承」は既存クラスの機能を引き継ぐこと、エ「ポリモーフィズム」は同じインタフェースで異なる実装を切り替えられることをそれぞれ指し、いずれもオブジェクト指向の中核概念です。
  options:
    - { body: "カプセル化", correct: false }
    - { body: "継承", correct: false }
    - { body: "再帰", correct: true }
    - { body: "ポリモーフィズム", correct: false }

- body: "関数型プログラミングに関する記述として最も適切なものはどれか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    関数型プログラミングでは、関数を第一級オブジェクトとして扱い、副作用を避けて純粋関数を組み合わせます。同じ入力に対して常に同じ出力を返す純粋関数を中心にプログラムを構築するのが特徴です。

    ア「データと処理をオブジェクトにまとめる」はオブジェクト指向の説明。イ「機械語に近い命令を順に並べる」はアセンブリ言語など低水準言語の特徴。ウ「データベースに問い合わせる」は宣言型のうち SQL のような特定用途言語の説明であり、関数型プログラミング一般の説明としては不適切です。
  options:
    - { body: "データと処理をオブジェクトにまとめて記述する", correct: false }
    - { body: "機械語に近い命令を順に並べて記述する", correct: false }
    - { body: "データベースに問い合わせる構文で記述する", correct: false }
    - { body: "関数を第一級オブジェクトとして扱い、副作用を避けて記述する", correct: true }
