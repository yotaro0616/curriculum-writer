- body: "n 個の要素を持つ配列に対して、ある添字 i の要素にアクセスする操作の計算量として最も適切なものはどれか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    配列はメモリ上の連続した領域に要素を並べるデータ構造であり、添字 i の要素のアドレスは「先頭アドレス + i × 1 要素のサイズ」という単純な計算で求められます。要素数 n に関係なく一定時間で計算できるため、計算量は O(1) です。

    ア「O(log n)」は二分探索などの計算量、イ「O(n)」は線形探索や連結リストの任意添字アクセスの計算量、エ「O(n^2)」は単純な二重ループの計算量で、いずれも配列のランダムアクセスには該当しません。
  options:
    - { body: "O(1)", correct: true }
    - { body: "O(log n)", correct: false }
    - { body: "O(n)", correct: false }
    - { body: "O(n^2)", correct: false }

- body: "n 個の要素を持つ単方向連結リストに関する記述として、最も適切なものはどれか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    単方向連結リストでは、各ノードが「値」と「次のノードへのポインタ」を持ち、先頭から順に辿ることで要素にアクセスします。挿入したい位置のノードへの参照が既にある場合、その前後のポインタを書き換えるだけで挿入できるため O(1) です。

    ア「任意の添字に O(1) でアクセスできる」は誤り。先頭から辿る必要があるため O(n) です。これは配列の性質です。
    ウ「要素は必ずメモリ上に連続して配置される」は誤り。連結リストの特徴は、ノードがメモリ上のどこにあってもポインタで繋ぐ点にあります。
    エ「双方向リストと異なり、末尾から先頭へ辿ることができる」は誤り。単方向リストはその名のとおり一方向にしか辿れません。
  options:
    - { body: "任意の添字に O(1) でアクセスできる", correct: false }
    - { body: "位置がわかっている場合、要素の挿入は O(1) でできる", correct: true }
    - { body: "要素は必ずメモリ上に連続して配置される", correct: false }
    - { body: "双方向リストと異なり、末尾から先頭へ辿ることができる", correct: false }

- body: "配列と連結リストの計算量を比較した記述として誤っているものはどれか。ただし、配列は固定長で領域に余裕があり、連結リストは単方向で要素数 n のものとする"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    エ「先頭への要素挿入は配列のほうが連結リストより速い」が誤りです。配列で先頭に要素を挿入すると、後続の n 個の要素を 1 つずつ後ろへずらす必要があるため O(n) かかります。一方、連結リストでは先頭ポインタを新しいノードに切り替えるだけで O(1) で済むため、連結リストのほうが速くなります。

    ア「添字 i の要素へのアクセスは配列が O(1)、連結リストが O(n)」は正しい記述です。
    イ「末尾への要素挿入は配列が O(1)、連結リストも末尾ポインタを保持していれば O(1)」は正しい記述です。
    ウ「使用メモリ量は連結リストのほうがポインタの分だけ多くなる」は正しい記述です。
  options:
    - { body: "添字 i の要素へのアクセスは配列が O(1)、連結リストが O(n) である", correct: false }
    - { body: "末尾への要素挿入は配列・連結リストともに O(1) で実装できる", correct: false }
    - { body: "使用メモリ量は連結リストのほうがポインタの分だけ多くなる", correct: false }
    - { body: "先頭への要素挿入は配列のほうが連結リストより速い", correct: true }
