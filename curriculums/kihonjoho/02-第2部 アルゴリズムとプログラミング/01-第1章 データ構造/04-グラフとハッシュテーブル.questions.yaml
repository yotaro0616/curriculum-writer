- body: "V 個の頂点を持つグラフを隣接行列で表現したときの空間計算量として最も適切なものはどれか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    隣接行列は V × V の 2 次元配列を使ってグラフを表現します。辺の有無に関わらず V × V = V² 個のセルが必要なので、空間計算量は O(V²) です。これは密グラフでは効率的ですが、疎グラフでは大量のメモリを無駄遣いすることになります。

    ア「O(V)」は頂点リストだけを持つ場合の計算量で、辺の情報は持てません。
    ウ「O(V + E)」は隣接リスト（E は辺の数）で表現したときの空間計算量です。
    エ「O(E)」は辺だけのリスト（edge list）で表現したときの計算量で、隣接行列ではありません。
  options:
    - { body: "O(V)", correct: false }
    - { body: "O(V²)", correct: true }
    - { body: "O(V + E)", correct: false }
    - { body: "O(E)", correct: false }

- body: "ハッシュテーブルにおいて、異なるキーが同じハッシュ値（バケット）にマッピングされる現象を何と呼ぶか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    異なるキーが同じバケット（添字）にマッピングされる現象を衝突 (collision) と呼びます。ハッシュ関数の値域はバケット数より広いケースが多く、衝突は原理的に避けられないため、ハッシュテーブルでは必ず衝突解決の仕組み（チェイン法やオープンアドレス法）を用意します。

    イ「ハッシュ化」はキーをハッシュ関数で値に変換する操作そのものを指し、衝突を意味しません。
    ウ「再ハッシュ」（rehashing）は負荷率が高くなったときにバケット数を増やして全要素を再配置する操作で、衝突そのものではなく衝突を減らすための対処です。
    エ「マッピング」は単に対応付けを意味し、特定のハッシュテーブルの問題を指す用語ではありません。
  options:
    - { body: "衝突 (collision)", correct: true }
    - { body: "ハッシュ化", correct: false }
    - { body: "再ハッシュ", correct: false }
    - { body: "マッピング", correct: false }

- body: "ハッシュテーブルの衝突解決方法に関する記述として、最も適切なものはどれか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    チェイン法（separate chaining）は、各バケットに連結リストを持たせ、同じバケットに割り当てられた要素をリストとして繋いでいく方法です。これにより衝突が発生しても、同じバケットの中で複数要素を保持できます。

    ア「線形探索法は、衝突が発生したら別のハッシュテーブルに格納する方法である」は誤り。線形探索法はオープンアドレス法の一種で、同じテーブル内の次のバケット、その次のバケット、と順番に空きを探す方法です。
    イ「オープンアドレス法では、各バケットが連結リストを持つ」は誤り。連結リストを使うのはチェイン法で、オープンアドレス法は配列のみで完結します。
    エ「ダブルハッシュ法は、2 つのハッシュテーブルを併用する方法である」は誤り。ダブルハッシュ法はオープンアドレス法の一種で、別のハッシュ関数で計算したステップ幅を使って空きを探す方法であり、テーブルは 1 つです。
  options:
    - { body: "線形探索法は、衝突が発生したら別のハッシュテーブルに格納する方法である", correct: false }
    - { body: "オープンアドレス法では、各バケットが連結リストを持つ", correct: false }
    - { body: "チェイン法は、同じバケットに割り当てられた要素を連結リストで保持する方法である", correct: true }
    - { body: "ダブルハッシュ法は、2 つのハッシュテーブルを併用する方法である", correct: false }
