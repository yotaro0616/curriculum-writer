- body: "n 個の節を持つ平衡二分探索木に対して、ある値を探索する操作の最悪時の計算量として最も適切なものはどれか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    平衡二分探索木（AVL 木や赤黒木）は、挿入や削除のたびに木の形を自動的に調整して、左右の部分木の高さの差を一定以内に保ちます。これにより木の高さは常に約 log₂ n に保たれ、探索の最悪計算量も O(log n) になります。

    ア「O(1)」はハッシュテーブルの平均探索時間で、二分探索木の計算量ではありません。
    ウ「O(n)」は単なる二分探索木（平衡化されていない BST）の最悪計算量で、ソート済みの値を順に挿入すると右だけに伸びる串刺し状になり O(n) に劣化します。
    エ「O(n log n)」は整列アルゴリズム（マージソートやヒープソート）の計算量で、単一の探索には該当しません。
  options:
    - { body: "O(1)", correct: false }
    - { body: "O(log n)", correct: true }
    - { body: "O(n)", correct: false }
    - { body: "O(n log n)", correct: false }

- body: "次の二分木を前順（preorder）で走査したときの訪問順序として最も適切なものはどれか。木の構造は、根が A で、A の左の子は B、A の右の子は C、B の左の子は D、B の右の子は E、C の右の子は F とする"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    前順走査は「親 → 左部分木 → 右部分木」の順で訪問します。
    1. 根 A を訪問
    2. A の左部分木へ。B を訪問
    3. B の左部分木へ。D を訪問（D は葉なので戻る）
    4. B の右部分木へ。E を訪問（E は葉なので戻る）
    5. A の右部分木へ。C を訪問
    6. C の右部分木へ。F を訪問
    結果: A → B → D → E → C → F

    ア「A → B → C → D → E → F」はレベル順走査（幅優先）の結果です。
    イ「D → B → E → A → C → F」は中順走査（左 → 親 → 右）の結果です。
    エ「D → E → B → F → C → A」は後順走査（左 → 右 → 親）の結果です。
  options:
    - { body: "A → B → C → D → E → F", correct: false }
    - { body: "D → B → E → A → C → F", correct: false }
    - { body: "A → B → D → E → C → F", correct: true }
    - { body: "D → E → B → F → C → A", correct: false }

- body: "ヒープに関する記述として、最も適切なものはどれか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    ヒープは完全二分木の形をしており、最大ヒープなら「親 ≥ 子」、最小ヒープなら「親 ≤ 子」の関係をすべての節で満たします。根が常に最大値または最小値になるため、最大値 / 最小値の取得は O(1)、挿入と削除は木の高さ分の操作で済むため O(log n) です。優先度付きキューの内部実装として広く使われます。

    ア「ヒープでは左の子 < 親 < 右の子の関係が成り立つ」は誤り。これは二分探索木 (BST) の性質で、ヒープは「親と子」の大小関係のみを規定し、兄弟（左の子と右の子）の間の大小関係は定めません。
    イ「最大ヒープでは葉が常に最大値である」は誤り。最大値は根にあります。
    ウ「ヒープからの最大値（または最小値）の取り出しは O(n) かかる」は誤り。取り出し（dequeue）は O(log n) で、取得（peek）は O(1) です。
  options:
    - { body: "ヒープでは左の子 < 親 < 右の子の関係が成り立つ", correct: false }
    - { body: "最大ヒープでは葉が常に最大値である", correct: false }
    - { body: "ヒープからの最大値（または最小値）の取り出しは O(n) かかる", correct: false }
    - { body: "ヒープは完全二分木で、優先度付きキューの内部実装として使われる", correct: true }
