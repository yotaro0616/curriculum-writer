- body: "次の擬似コードで fib(n) を計算するときの呼び出し回数のオーダはどれか。fib(n) = if n < 2 return n else return fib(n-1) + fib(n-2)"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    エが正解です。再帰の各呼び出しが 2 つの新たな再帰呼び出しを生むため、呼び出し回数のオーダは O(2^n) です。
    たとえば fib(5) は計 15 回程度、fib(40) は 10 億回を超えるなど、n に対して指数的に増加します。
    これが「素朴なフィボナッチの罠」と呼ばれる理由で、メモ化または動的計画法を使えば O(n) まで改善できます。

    ア「O(n)」はメモ化または動的計画法で実装した場合の計算量です(素朴な再帰ではありません)。
    イ「O(log n)」は二分探索などの対数時間アルゴリズムのオーダで、フィボナッチの素朴再帰には当てはまりません。
    ウ「O(n^2)」は二重ループの計算量で、これも素朴な再帰の呼び出し回数とは一致しません。
  options:
    - { body: "O(n)", correct: false }
    - { body: "O(log n)", correct: false }
    - { body: "O(n^2)", correct: false }
    - { body: "O(2^n)", correct: true }

- body: "動的計画法を適用するのに適した問題の特徴として、最も適切なものはどれか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    イが正解です。動的計画法(DP)は「問題を小さな部分問題に分割でき、かつ同じ部分問題が複数回現れる(重複部分問題)」場合に効果を発揮します。
    重複する部分問題の結果を保存(メモ化)または小さい順に表を埋める(タビュレーション)ことで、指数オーダの計算を多項式時間に短縮できます。

    ア「部分問題が常に独立し重複しない」は分割統治法に適した条件です(マージソート、二分探索など)。重複が無いと DP のメリットが出ません。
    ウ「常に局所最適を選べば全体最適が得られる」は貪欲法の適用条件で、DP の特徴ではありません。
    エ「データが整列済みであること」は二分探索の前提条件で、DP とは無関係です。
  options:
    - { body: "部分問題が常に互いに独立しており、重複が一切ない", correct: false }
    - { body: "問題を部分問題に分割でき、かつ同じ部分問題が複数回現れる", correct: true }
    - { body: "各ステップで局所的に最適な選択を続ければ全体最適が得られる", correct: false }
    - { body: "入力データが整列済みであること", correct: false }

- body: "アルゴリズム設計手法の説明として、最も適切な組合せはどれか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    ウが正解です。
    分割統治法は問題を部分問題に分けて再帰的に解き、結果を結合する手法で、マージソート・クイックソート・二分探索が代表例です。
    動的計画法は重複する部分問題の結果を保存・再利用する手法で、フィボナッチやナップサック問題に有効です。
    貪欲法は各段階で局所最適を選び続ける手法で、最適解になるかは問題の性質によります。

    ア「貪欲法は常に最適解を保証する」は誤り。ナップサック問題などでは貪欲法は最適解になりません。
    イ「分割統治法は重複部分問題を再利用する」は誤り。重複部分問題の再利用は動的計画法の特徴です。
    エ「動的計画法は部分問題を独立に解く」は誤り。部分問題が互いに独立なのは分割統治法の特徴で、動的計画法は重複を利用します。
  options:
    - { body: "貪欲法は常にすべての問題で最適解を保証する", correct: false }
    - { body: "分割統治法は重複する部分問題の結果を保存して再利用する", correct: false }
    - { body: "分割統治法は問題を部分問題に分けて再帰的に解き結合する手法で、マージソートや二分探索が代表例である", correct: true }
    - { body: "動的計画法は部分問題を互いに独立に解き結果を結合する", correct: false }
