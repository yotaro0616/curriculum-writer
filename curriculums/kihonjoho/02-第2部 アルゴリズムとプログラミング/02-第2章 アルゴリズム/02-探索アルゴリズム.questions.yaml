- body: "整列済みの 1,024 個のデータに対して二分探索を行うとき、目的の値を見つけるまでの最大の比較回数はおよそいくつか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    二分探索は範囲を毎回半分に絞るため、最大の比較回数は log2 n です。
    1,024 = 2^10 なので log2 1,024 = 10 回となります。

    ア「5 回」は 32 個(2^5)のデータに対する最大比較回数です。
    イ「8 回」は 256 個(2^8)のデータに対する最大比較回数です。
    エ「20 回」は約 100 万個(2^20)のデータに対する最大比較回数で、1,024 個には大きすぎます。
  options:
    - { body: "5 回", correct: false }
    - { body: "8 回", correct: false }
    - { body: "10 回", correct: true }
    - { body: "20 回", correct: false }

- body: "ハッシュ探索の特徴として正しい記述はどれか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    エが正解です。ハッシュ関数でキーからインデックスを直接計算するため、要素数に依存せず平均 O(1) でアクセスできます。
    ただし複数のキーが同じインデックスに割り当てられる衝突が集中した場合、連結リストの線形走査などにより最悪 O(n) まで劣化します。

    ア「整列されたデータが必要」は誤り。これは二分探索の前提です。ハッシュ探索は整列されていないデータでも使えます。
    イ「範囲検索 (BETWEEN) に強い」は誤り。ハッシュ探索は厳密一致専用で、範囲検索には不向きです。範囲検索には B 木インデックスが適しています。
    ウ「最悪計算量も O(1) で保証される」は誤り。衝突が集中すると最悪 O(n) になり、保証はされません。
  options:
    - { body: "整列されたデータに対してのみ適用できる", correct: false }
    - { body: "範囲を指定する検索 (BETWEEN) に強い", correct: false }
    - { body: "衝突の有無に関わらず最悪計算量も O(1) で保証される", correct: false }
    - { body: "平均計算量は O(1) だが、衝突が集中した場合の最悪計算量は O(n) になる", correct: true }

- body: "次のうち、線形探索と比較した二分探索の特徴として正しいものはどれか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    アが正解です。二分探索は範囲を毎回半分に絞るため計算量 O(log n) で、線形探索の O(n) より速いですが、
    探索対象のデータが整列されていることが必須の前提です。
    また、配列のように添字で中央要素に O(1) でアクセスできること(ランダムアクセス可能)も必要です。

    イ「整列されていないデータでも適用可能」は誤り。線形探索の特徴であり、二分探索は整列済みデータが必須です。
    ウ「連結リストに対して効率的に動作する」は誤り。連結リストは中央要素へのアクセスに O(n) かかるため、二分探索の利点が失われます。
    エ「データ件数によらず比較回数が一定」は誤り。二分探索の比較回数は log n に比例して増えます(一定なのはハッシュ探索の平均計算量)。
  options:
    - { body: "計算量は O(log n) だが、データが整列済みであることが必須である", correct: true }
    - { body: "整列されていないデータに対しても直接適用できる", correct: false }
    - { body: "連結リストに対しても配列と同等に効率的に動作する", correct: false }
    - { body: "データ件数によらず比較回数が常に一定である", correct: false }
