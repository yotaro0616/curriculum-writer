- body: "n 個の要素から成る配列に対してバブルソートを行うときの、平均および最悪の比較回数のオーダはどれか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    バブルソートは隣接する要素の比較・交換を、未整列部分が無くなるまで繰り返します。
    n 個の要素に対して外側のループが n-1 回、内側のループが平均 n/2 回回るので、
    比較回数は約 n×(n-1)/2 回、すなわちオーダは O(n^2) になります。これは平均でも最悪でも同じです。

    ア「O(n)」は線形時間で、バブルソートでは達成できません(整列済みでも全ペアを走査する素朴実装の場合)。
    ウ「O(n log n)」はマージソート・ヒープソートなどの高速ソートのオーダで、バブルソートの計算量ではありません。
    エ「O(n!)」は順列を全列挙する規模のオーダで、整列アルゴリズムには現れません。
  options:
    - { body: "O(n)", correct: false }
    - { body: "O(n^2)", correct: true }
    - { body: "O(n log n)", correct: false }
    - { body: "O(n!)", correct: false }

- body: "整列アルゴリズムの特性として最も適切な組合せはどれか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    エが正解です。マージソートは「分割して再帰的にソートし、ソート済みの 2 つをマージする」分割統治法であり、
    平均・最悪ともに O(n log n) を保証し、同じ値の元の順序を保つ安定ソートです。
    ただしマージ用の作業領域が O(n) 必要です。

    ア「クイックソートは最悪 O(n log n)」は誤り。クイックソートの最悪計算量は O(n^2) です(ピボット選びが偏った場合)。
    イ「ヒープソートは安定ソートである」は誤り。ヒープソートは離れた位置と交換するため不安定です。
    ウ「選択ソートは安定ソートである」は誤り。選択ソートは最小値と離れた位置を交換するため不安定です。
  options:
    - { body: "クイックソートの最悪計算量は O(n log n) である", correct: false }
    - { body: "ヒープソートは安定ソートである", correct: false }
    - { body: "選択ソートは安定ソートである", correct: false }
    - { body: "マージソートは平均・最悪ともに O(n log n) で安定ソートである", correct: true }

- body: "クイックソートの平均計算量と空間計算量の組合せとして正しいものはどれか"
  category: "アルゴリズムとプログラミング"
  status: published
  explanation: |
    ウが正解です。クイックソートはピボットで配列をほぼ半分に分けることで、平均的な再帰の深さが log n、
    各段で n 個の要素を処理するので平均時間計算量は O(n log n) になります。
    再帰呼び出しのスタックフレームが log n 段積まれるため、平均空間計算量は O(log n) です。

    ア「O(n^2)、O(1)」は最悪時間計算量と空間計算量の組合せで、平均ではありません。
    イ「O(n log n)、O(n)」のうち空間 O(n) はマージソートの値で、クイックソートではありません。
    エ「O(n)、O(log n)」の時間 O(n) は線形探索などの計算量で、整列を達成できません。
  options:
    - { body: "時間計算量 O(n^2)、空間計算量 O(1)", correct: false }
    - { body: "時間計算量 O(n log n)、空間計算量 O(n)", correct: false }
    - { body: "時間計算量 O(n log n)、空間計算量 O(log n)", correct: true }
    - { body: "時間計算量 O(n)、空間計算量 O(log n)", correct: false }
